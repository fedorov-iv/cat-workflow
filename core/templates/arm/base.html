<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}АРМ — заявки{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
  <style>
    .ts-wrapper.single .ts-control { flex-wrap: nowrap; }
    .ts-wrapper.single .ts-control .item { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    body > .ts-dropdown { z-index: 1070; }
    .btn-blocked { color: #8c959f; border: 1px dashed #c4ccd4; background: #f6f8fa; cursor: help; }
    .btn-blocked:hover { color: #8c959f; }
    dl.app-fields { display: grid; grid-template-columns: 240px 1fr; gap: 6px 12px; margin: 0; }
    dl.app-fields dt { font-weight: normal; color: var(--bs-secondary-color); }
    dl.app-fields dd { margin: 0; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand">АРМ (прототип)</span>
    <div class="navbar-nav">
      <a class="nav-link" href="{% url 'arm:application-list' %}">Заявки</a>
      <a class="nav-link" href="{% url 'admin:workflow_workflow_changelist' %}">Конструктор процессов</a>
      <a class="nav-link" href="{% url 'admin:workflow_transitionform_changelist' %}">Формы</a>
      <a class="nav-link" href="{% url 'api:docs' %}">API</a>
    </div>
  </div>
</nav>
<main class="container">
  {% for m in messages %}
    <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags }}{% endif %} alert-dismissible fade show">
      {{ m }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>

<div class="modal fade" id="transition-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content" id="transition-modal-content"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
<script>
  (function () {
    const modalEl = document.getElementById('transition-modal');
    const content = document.getElementById('transition-modal-content');
    const modal = new bootstrap.Modal(modalEl);
    const ajaxHeaders = {'X-Requested-With': 'XMLHttpRequest'};

    // Зависимые списки: у вариантов data-parent — значения родителя, при которых вариант доступен.
    // Вызывать до initAutocomplete: исходные варианты читаются из DOM.
    window.initDependentLists = function (container) {
      const form = container.querySelector('form.js-transition-form');
      if (!form) return;
      const lists = [...form.querySelectorAll('select[data-depends-on]')].map((el) => ({
        el,
        parent: el.dataset.dependsOn,
        options: [...el.options].map((o) => ({
          value: o.value, text: o.textContent, parents: o.dataset.parent ? JSON.parse(o.dataset.parent) : null,
        })),
      }));
      const refresh = function (list) {
        const parentEl = form.elements[list.parent];
        const parentValue = parentEl ? parentEl.value : '';
        const allowed = list.options.filter((o) => o.value === '' || !o.parents || o.parents.includes(parentValue));
        const current = list.el.value;
        const keep = allowed.some((o) => o.value === current) ? current : '';
        const ts = list.el.tomselect;
        if (ts) {
          ts.clear(true);
          ts.clearOptions();
          ts.addOptions(allowed.filter((o) => o.value !== ''));
          ts.setValue(keep, true);
        } else {
          list.el.replaceChildren(...allowed.map((o) => new Option(o.text, o.value)));
          list.el.value = keep;
        }
        if (keep !== current) list.el.dispatchEvent(new Event('change', {bubbles: true}));
      };
      form.addEventListener('change', function (event) {
        for (const list of lists) {
          if (event.target.name === list.parent) refresh(list);
        }
      });
      lists.forEach(refresh);
    };

    // Список с автокомплитом по уже отрисованным вариантам; выпадашка в body, иначе её обрезает прокрутка модалки.
    window.initAutocomplete = function (container) {
      container.querySelectorAll('select[data-autocomplete="local"]:not(.tomselected)').forEach(function (el) {
        new TomSelect(el, {
          placeholder: 'Начните вводить или выберите',
          allowEmptyOption: false,
          maxOptions: null,
          dropdownParent: 'body',
          plugins: el.required ? [] : ['clear_button'],
          render: {no_results: () => '<div class="no-results">Ничего не найдено</div>'},
        });
      });
    };

    // Показывает поля формы по правилам visible_if (данные лежат в json_script внутри формы).
    window.applyVisibility = function (container) {
      const form = container.querySelector('form.js-transition-form');
      const rulesEl = container.querySelector('.js-visibility-rules');
      if (!form || !rulesEl) return;
      const rules = JSON.parse(rulesEl.textContent);
      const value = (name) => {
        const el = form.elements[name];
        if (!el) return '';
        if (el.type === 'checkbox') return el.checked ? 'true' : 'false';
        return el.value;
      };
      const apply = () => {
        for (const [field, [param, expected]] of Object.entries(rules)) {
          const row = form.querySelector('[data-field="' + field + '"]');
          if (row) row.classList.toggle('d-none', value(param) !== expected);
        }
      };
      form.addEventListener('change', apply);
      apply();
    };

    function showError(message) {
      let alert = content.querySelector('.js-modal-error');
      if (!alert) return window.alert(message);
      alert.textContent = message;
      alert.classList.remove('d-none');
    }

    function destroyAutocomplete() {
      content.querySelectorAll('select.tomselected').forEach((el) => el.tomselect.destroy());
    }
    modalEl.addEventListener('hide.bs.modal', destroyAutocomplete);

    function render(html) {
      destroyAutocomplete();
      content.innerHTML = html;
      initDependentLists(content);
      initAutocomplete(content);
      applyVisibility(content);
      const first = content.querySelector(
        'input:not([type=hidden]):not(.ts-control input), select:not(.tomselected), textarea');
      if (first) first.focus();
    }

    document.addEventListener('click', async function (event) {
      const link = event.target.closest('a[data-transition-modal]');
      if (!link) return;
      event.preventDefault();
      content.innerHTML = '<div class="modal-body text-center py-5"><div class="spinner-border"></div></div>';
      modal.show();
      try {
        const response = await fetch(link.href, {headers: ajaxHeaders});
        if (!response.ok) throw new Error(response.statusText);
        render(await response.text());
      } catch (e) {
        content.innerHTML = '<div class="modal-body"><div class="alert alert-danger mb-0">Не удалось загрузить форму: '
          + e.message + '</div></div>';
      }
    });

    content.addEventListener('submit', async function (event) {
      const form = event.target.closest('form.js-transition-form');
      if (!form) return;
      event.preventDefault();
      const submit = form.querySelector('[type=submit]');
      submit.disabled = true;
      try {
        const response = await fetch(form.action, {method: 'POST', body: new FormData(form), headers: ajaxHeaders});
        const data = await response.json();
        if (data.ok) {
          window.location.href = data.redirect;
        } else if (data.html) {
          render(data.html);
        } else {
          showError(data.error || 'Не удалось выполнить переход');
          submit.disabled = false;
        }
      } catch (e) {
        showError('Ошибка запроса: ' + e.message);
        submit.disabled = false;
      }
    });

    initDependentLists(document);
    initAutocomplete(document);
    applyVisibility(document);
  })();
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
